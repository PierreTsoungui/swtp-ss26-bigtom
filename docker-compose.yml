services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      # Only allow the following endpoints:
      - CONTAINERS=1   # required to filter containers by label
      - EXEC=1         # allow "docker exec" to run jobs in the backend container
      - POST=1         # exec is a POST request, so we need to allow POST requests
      # Disallow the following endpoints:
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - INFO=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - AUTH=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-net
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /var/cache/nginx:size=64M,mode=1777
      - /var/run:size=16M,mode=1777
      - /etc/nginx/conf.d:size=10M,mode=1777
    cap_drop:
      - ALL
    volumes:
      - ./certs/bigtom-local.pem:/etc/nginx/certs/bigtom-local.pem:ro
      - ./certs/bigtom-local-key.pem:/etc/nginx/certs/bigtom-local-key.pem:ro
    networks:
      - frontend-net

  backend:
    build: ./backend
    user: "1000:1000"
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_BASE_DIR=${JOB_BASE_DIR:-/app/jobs}
      - JOB_RETENTION_HOURS=${JOB_RETENTION_HOURS:-24}
      - JOB_CLEANUP_INTERVAL_SECONDS=${JOB_CLEANUP_INTERVAL_SECONDS:-86400}
      - DMR_CORES=${DMR_CORES:-4}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - PIPELINE_MEMORY_BUDGET_GB=${PIPELINE_MEMORY_BUDGET_GB:-8}
      - PIPELINE_CORE_BUDGET=${PIPELINE_CORE_BUDGET:-2}
      - PIPELINE_STEP_MEMORY_GB=${PIPELINE_STEP_MEMORY_GB:-5}
      - PIPELINE_DMR_MEMORY_GB=${PIPELINE_DMR_MEMORY_GB:-6}
      - PIPELINE_DMP_MEMORY_GB=${PIPELINE_DMP_MEMORY_GB:-4}
      - MAX_SAMPLES_PER_JOB=${MAX_SAMPLES_PER_JOB:-48}
      - MAX_JOBS_DISK_GB=${MAX_JOBS_DISK_GB:-0}
      - MAX_TOTAL_UPLOAD_MB=${MAX_TOTAL_UPLOAD_MB:-900}
      - MAX_SAMPLE_SHEET_MB=${MAX_SAMPLE_SHEET_MB:-10}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,https://localhost,https://127.0.0.1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    # Backstop so a backend leak can't take the host down. It only orchestrates
    # (state + docker exec), so it needs little memory.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    volumes:
      - ./jobs:/app/jobs
      - ./r_backend:/app/r_backend
    cap_drop:
      - ALL
    depends_on:
      - docker-socket-proxy
      - r_worker
    networks:
      - frontend-net
      - proxy-net

  r_worker:
    build: ./r_backend
    user: "1000:1000"
    # HARD RESOURCE WALL — all R analyses run here. If the container exceeds these
    # limits its OWN cgroup OOM-killer stops the offending R process while the
    # HOST (and other services) stay alive — this is what prevents the whole
    # machine from crashing under load. Set to the deployment budget and keep
    # >= PIPELINE_MEMORY_BUDGET_GB / PIPELINE_CORE_BUDGET (the backend's soft
    # queue), so the queue normally kicks in first and this is only a backstop.
    mem_limit: ${R_WORKER_MEM_LIMIT:-10g}
    cpus: ${R_WORKER_CPUS:-2}
    ulimits:
      nproc:
        soft: 65536
        hard: 65536
      nofile:
        soft: 65536
        hard: 65536
      stack: 67108864
    environment:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - BLAS_NUM_THREADS=1
      - BIOCPARALLEL_WORKER_NUMBER=1
      - R_BIOC_PARALLEL_WORKERS=1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./r_backend:/app/r_backend
      - ./data:/app/data
      - ./jobs:/app/jobs
    command: tail -f /dev/null
    networks:
      - isolated

networks:
  frontend-net:
    driver: bridge
  proxy-net:
    driver: bridge
    internal: true
  isolated:
    driver: bridge
    internal: true