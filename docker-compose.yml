
services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./jobs:/app/jobs
      - ./r_backend:/app/r_backend
      - /var/run/docker.sock:/var/run/docker.sock

  r_worker:
    build: ./r_backend
    security_opt:
      - seccomp:unconfined

    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"

    ulimits:
      nproc:
        soft: 65536
        hard: 65536

    volumes:
      - ./r_backend:/app/r_backend
      - ./data:/app/data
      - ./jobs:/app/jobs
    command: tail -f /dev/null
