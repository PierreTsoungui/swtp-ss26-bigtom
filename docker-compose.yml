services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_BASE_DIR=${JOB_BASE_DIR:-/app/jobs}
      - JOB_RETENTION_HOURS=${JOB_RETENTION_HOURS:-24}
      - JOB_CLEANUP_INTERVAL_SECONDS=${JOB_CLEANUP_INTERVAL_SECONDS:-86400}
      - DMR_CORES=${DMR_CORES:-4}
    ports:
      - "8000:8000"
    volumes:
      - ./jobs:/app/jobs
      - ./r_backend:/app/r_backend
      - /var/run/docker.sock:/var/run/docker.sock

  r_worker:
    build: ./r_backend
    security_opt:
      - seccomp:unconfined
    ulimits:
      nproc:
        soft: 65536
        hard: 65536
      nofile:
        soft: 65536
        hard: 65536
      stack: 67108864
    environment:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - BLAS_NUM_THREADS=1
      - BIOCPARALLEL_WORKER_NUMBER=1
      - R_BIOC_PARALLEL_WORKERS=1
    volumes:
      - ./r_backend:/app/r_backend
      - ./data:/app/data
      - ./jobs:/app/jobs
    command: tail -f /dev/null
