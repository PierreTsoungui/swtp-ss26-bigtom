pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Rate Limit Zonen (pro IP)
    ##
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=status_zone:10m rate=25r/m;
    limit_req_zone $binary_remote_addr zone=light_zone:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=medium_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=strict_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=batch_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=table_zone:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=export_zone:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:$server_port$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/bigtom-local.pem;
        ssl_certificate_key /etc/nginx/certs/bigtom-local-key.pem;

        ##
        # Frontend
        ##
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        ##
        # Default API Proxy
        ##
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 1400M;
            proxy_read_timeout 500s;
            proxy_connect_timeout 300s;
        }

        #################################################
        # Upload
        #################################################
        location ~ ^/api/v1/upload(/|$) {
            limit_req zone=upload_zone burst=3 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Status Polling
        #################################################
        location ~ ^/api/v1/status/ {
            limit_req zone=status_zone burst=10 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Filter Stats
        #################################################
        location ~ ^/api/v1/filter/.*/stats$ {
            limit_req zone=light_zone burst=5;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Normalization Preview
        #################################################
        location ~ ^/api/v1/preview/normalization/.*/[^/]+$ {
            limit_req zone=medium_zone burst=10;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/preview/normalization/ {
            limit_req zone=medium_zone burst=5;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Normalize
        #################################################
        location ~ ^/api/v1/normalize/ {
            limit_req zone=strict_zone burst=2 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Batch
        #################################################
        location ~ ^/api/v1/batch/.*/skip$ {
            limit_req zone=strict_zone burst=2 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/batch/.*/svd-plot/ {
            limit_req zone=light_zone burst=10;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/batch/.*/(history|batch-options|sample-sheet)$ {
            limit_req zone=light_zone burst=5;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/batch/ {
            limit_req zone=batch_zone burst=3 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Table
        #################################################
        location ~ ^/api/v1/table/.*/.*/export$ {
            limit_req zone=export_zone burst=3;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/table/ {
            limit_req zone=table_zone burst=15;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Heatmap
        #################################################
        location ~ ^/api/v1/heatmap/.*/options$ {
            limit_req zone=light_zone burst=5;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/heatmap/[^/]+$ {
            limit_req zone=medium_zone burst=5;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        #################################################
        # Reset
        #################################################
        location ~ ^/api/v1/reset/ {
            limit_req zone=strict_zone burst=2 nodelay;
            proxy_pass http://backend:8000;
            include /etc/nginx/proxy_params;
        }

        ##
        # Error Handling
        ##
        error_page 429 /429.json;
        location = /429.json {
            default_type application/problem+json;
            return 429 '{"title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Please wait before retrying."}';
        }

    }
}